[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyairlift"
version = "0.1.0"
description = "Cross-platform AirLift (ATAirlock) sandbox-escape file writer for iPhones, on pymobiledevice3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pymobiledevice3>=10.6",
]

[project.scripts]
pyairlift = "pyairlift.cli:main"

[tool.setuptools]
packages = ["src", "src.airlift", "pyairlift"]